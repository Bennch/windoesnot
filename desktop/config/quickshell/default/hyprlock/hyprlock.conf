# Style-10 inspired Hyprlock config with live blurred screenshot background.
# Copy this file to ~/.config/hypr/hyprlock.conf after installing Hyprlock.

general {
    disable_loading_bar = true
    hide_cursor = true
    grace = 0
}

background {
    monitor =
    path = /tmp/hyprlock-bg.png
    blur_passes = 3
    blur_size = 8
    noise = 0.008
    color = rgba(0, 0, 0, 0.25)
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.92)
    font_family = JetBrainsMono Nerd Font
    font_size = 96
    shadow_color = rgba(0, 0, 0, 0.45)
    shadow_size = 12
    position = 0, -200
    halign = center
    valign = center
}

label {
    monitor =
    text = $DATE
    color = rgba(230, 230, 240, 0.9)
    font_family = JetBrainsMono Nerd Font
    font_size = 24
    shadow_color = rgba(0, 0, 0, 0.25)
    shadow_size = 8
    position = 0, -130
    halign = center
    valign = center
}

label {
    monitor =
    text = Type your password to unlock
    color = rgba(210, 210, 220, 0.8)
    font_family = JetBrainsMono Nerd Font
    font_size = 16
    shadow_color = rgba(0, 0, 0, 0.2)
    shadow_size = 6
    position = 0, 10
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 64
    position = 0, 90
    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true
    fade_on_empty = true
    rounding = 14
    outline_thickness = 2
    inner_color = rgba(0, 0, 0, 0.38)
    outer_color = rgba(255, 255, 255, 0.22)
    font_color = rgba(255, 255, 255, 0.92)
    font_family = JetBrainsMono Nerd Font
    font_size = 18
    placeholder_text = Password
    placeholder_text_color = rgba(255, 255, 255, 0.6)
    fail_color = rgba(220, 30, 70, 0.7)
    shadow_size = 16
    shadow_color = rgba(0, 0, 0, 0.55)
    halign = center
    valign = center
}
