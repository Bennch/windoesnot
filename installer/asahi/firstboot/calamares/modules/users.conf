---
defaultGroups: [wheel, video, audio, network, storage, lp]
doAutologin: false
sudoersGroup: wheel
sudoersConfigureWithGroup: true
setRootPassword: false
doReusePassword: false
passwordRequirements:
  nonempty: true
allowWeakPasswords: false
allowWeakPasswordsDefault: false
userShell: /bin/bash
setHostname: EtcFile
writeHostsFile: true
hostname:
  template: "${first}-windoesnotmac"
