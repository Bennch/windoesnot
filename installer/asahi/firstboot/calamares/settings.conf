# Installed-system setup: never partition or reinstall a bootloader here.
---
modules-search: [local]
sequence:
  - show: [welcome, locale, keyboard, users, summary]
  - exec: [locale, keyboard, localecfg, users, displaymanager, windoesnotmacfinish]
  - show: [finished]
branding: windoesnotmac
prompt-install: true
dont-chroot: true
oem-setup: true
disable-cancel: true
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
